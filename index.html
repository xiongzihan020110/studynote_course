 const get=id=>document.getElementById(id);
 let revision=0;
 function makeLink(parent,href,title,selected=false){
  const link=document.createElement("a");link.href=href;link.textContent=title;
  if(selected)link.setAttribute("aria-current","true");
  parent.append(link);
 }
 async function render(){
  const current=++revision;
  const note=files.find(file=>location.hash==="#note-"+file.id);
  const group=groups.find(([key])=>key===(note?.group??location.hash.slice(8)))??groups[0];
  const [key,code,name]=group;
  get("code").textContent=code;get("name").textContent=name;
  for(const link of document.querySelectorAll("[data-group]")){
   if(link.dataset.group===key)link.setAttribute("aria-current","true");else link.removeAttribute("aria-current");
  }
  const cards=get("cards"), list=get("files"), content=get("content"), download=get("download");
  cards.replaceChildren();list.replaceChildren();content.replaceChildren();
  const label=document.createElement("strong");label.textContent="文件列表";list.append(label);
  cards.hidden=Boolean(note);download.hidden=!note;
  if(key==="python"){makeLink(cards,course,"Python 第二章 · 课程笔记");makeLink(list,course,"Python 第二章 · 课程笔记");}
  for(const file of files.filter(item=>item.group===key)){
   const url="#note-"+file.id;makeLink(cards,url,file.title);makeLink(list,url,file.title,file===note);
  }
  if(!note)return;
  download.href=prefix+note.path;content.textContent="正在加载笔记…";
  try{
   const response=await fetch(download.href, {cache: "no-cache"});if(!response.ok)throw Error();
   const markdown=await response.text();
   if(current===revision)content.innerHTML=DOMPurify.sanitize(marked.parse(markdown),{USE_PROFILES:{html:true}});
  }catch{if(current===revision)content.textContent="笔记预览加载失败，可以下载 Markdown 原文。";}
 }
 window.addEventListener("hashchange",render);render();
});
