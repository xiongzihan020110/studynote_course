<style>
:root{color-scheme:dark;--bg:#0b1028;--paper:#161e3c;--ink:#f7f8ff;--muted:#b9c3df;--line:#344064;--accent:#ff84ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Microsoft YaHei",system-ui,sans-serif}
a{color:var(--accent)}a:focus-visible,input:focus-visible{outline:3px solid #ff84ad;outline-offset:3px}
.topbar{background:var(--paper);border-bottom:1px solid var(--line);padding:0 clamp(20px,5vw,76px);min-height:68px;display:flex;align-items:center}
.brand{display:inline-flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-weight:700}

.reader{min-width:0;overflow-wrap:anywhere}.reader img{max-width:100%;height:auto}.reader pre{overflow:auto;padding:14px;border-radius:7px;background:#0d1430}.reader table{display:block;overflow:auto;border-collapse:collapse}.reader th,.reader td{padding:6px 10px;border:1px solid var(--line)}.reader h2,.reader h3{margin:1em 0 .4em}.reader p{margin:.75em 0}.download{display:inline-block;margin-bottom:8px}

<script>
if (/^#\/courses\/python(?:\/|$)/.test(location.hash)) location.replace("./knowledge-base/python/"+location.search+location.hash);
window.addEventListener("DOMContentLoaded",()=>{
 const files=[{"id":11,"group":"python","title":"0 jupyter使用注意事项.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/1023%20%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E4%B8%8E%E7%BC%96%E7%A8%8B%EF%BC%88Python%EF%BC%89/0%20jupyter%E4%BD%BF%E7%94%A8%E6%B3%A8%E6%84%8F%E4%BA%8B%E9%A1%B9.md"},{"id":12,"group":"python","title":"1 第一章 零基础讲解.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/1023%20%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E4%B8%8E%E7%BC%96%E7%A8%8B%EF%BC%88Python%EF%BC%89/1%20%E7%AC%AC%E4%B8%80%E7%AB%A0%20%E9%9B%B6%E5%9F%BA%E7%A1%80%E8%AE%B2%E8%A7%A3.md"},{"id":13,"group":"python","title":"1.1 作业一.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/1023%20%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E4%B8%8E%E7%BC%96%E7%A8%8B%EF%BC%88Python%EF%BC%89/1.1%20%E4%BD%9C%E4%B8%9A%E4%B8%80.md"},{"id":14,"group":"python","title":"2 第二章 零基础讲解.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/1023%20%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E4%B8%8E%E7%BC%96%E7%A8%8B%EF%BC%88Python%EF%BC%89/2%20%E7%AC%AC%E4%BA%8C%E7%AB%A0%20%E9%9B%B6%E5%9F%BA%E7%A1%80%E8%AE%B2%E8%A7%A3.md"},{"id":20,"group":"other","title":"1 MapReduce_完整知识笔记与英文逐句翻译.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/1033%20%E5%A4%A7%E6%95%B0%E6%8D%AE%E7%AE%A1%E7%90%86/1%20MapReduce_%E5%AE%8C%E6%95%B4%E7%9F%A5%E8%AF%86%E7%AC%94%E8%AE%B0%E4%B8%8E%E8%8B%B1%E6%96%87%E9%80%90%E5%8F%A5%E7%BF%BB%E8%AF%91.md"},{"id":15,"group":"writing","title":"0 第五周课程记录.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/1043%20%E5%86%99%E4%BD%9C%E5%88%86%E6%9E%90/0%20%E7%AC%AC%E4%BA%94%E5%91%A8%E8%AF%BE%E7%A8%8B%E8%AE%B0%E5%BD%95.md"},{"id":16,"group":"statistics","title":"0 第二次作业.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/1063%20%E7%BB%9F%E8%AE%A1%E5%AD%A6/0%20%E7%AC%AC%E4%BA%8C%E6%AC%A1%E4%BD%9C%E4%B8%9A.md"},{"id":23,"group":"other","title":"脑洞部长52天第一天.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/%E8%8B%B1%E8%AF%AD%E5%AD%A6%E4%B9%A0/%E8%84%91%E6%B4%9E%E9%83%A8%E9%95%BF52%E5%A4%A9%E7%AC%AC%E4%B8%80%E5%A4%A9.md"},{"id":22,"group":"other","title":"公开数据集平台网址汇总.md","path":"%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/%E8%AE%BA%E6%96%87%E7%9B%B8%E5%85%B3/%E5%85%AC%E5%BC%80%E6%95%B0%E6%8D%AE%E9%9B%86%E5%B9%B3%E5%8F%B0%E7%BD%91%E5%9D%80%E6%B1%87%E6%80%BB.md"}], prefix="./knowledge-base/", course="./knowledge-base/python/";
 const syncedFolders=["1023 数据科学与编程（Python）","1033 大数据管理","1043 写作分析","1063 统计学","英语学习","论文相关"];
 const folderCovers={};
 const imagePath=/\.(?:png|jpe?g|gif|webp|avif|svg|bmp|ico)$/i;
 function renderMarkdown(markdown,note){
  const notePath=decodeURIComponent(note.path);
  const noteFolder=notePath.slice(0,notePath.lastIndexOf("/")+1);
  const parser=new marked.Marked({extensions:[{
   name:"obsidianImage",level:"inline",
   start(src){return src.indexOf("![[");},
   tokenizer(src){
    const match=/^!\[\[([^\]\r\n]+)\]\]/.exec(src);
    if(!match)return;
    const name=match[1].split("|")[0].trim();
    if(!imagePath.test(name))return;
    const candidates=files.filter(file=>{
     const path=decodeURIComponent(file.path);
     return path===name||path.endsWith("/"+name);
    });
    const local=candidates.filter(file=>decodeURIComponent(file.path).startsWith(noteFolder));
    const direct=candidates.find(file=>decodeURIComponent(file.path)===noteFolder+name);
    const attachment=direct??(local.length===1?local[0]:candidates.length===1?candidates[0]:null);
    if(attachment)return {type:"obsidianImage",raw:match[0],path:attachment.path};
   },
   renderer(token){
    const img=document.createElement("img");
    img.src=new URL(prefix+token.path,location.href).href;
    img.alt="";img.loading="lazy";
    return img.outerHTML;
   }
  }]});
  const fragment=DOMPurify.sanitize(parser.parse(markdown),{USE_PROFILES:{html:true},RETURN_DOM_FRAGMENT:true});
  for(const img of fragment.querySelectorAll("img[src]")){
   const src=img.getAttribute("src");
   if(!/^(?:[a-z][a-z0-9+.-]*:|\/|#)/i.test(src))img.src=new URL(src,new URL(prefix+note.path,location.href)).href;
  }
  return fragment;
 }


 const homeTitle="欢迎来到Xizh的知识库";
 const get=id=>document.getElementById(id);
 const folders=new Set();
 function addFolder(path){
  while(path&&!folders.has(path)){
   folders.add(path);
   path=parentOf(path);
  }
 }
 function parentOf(path){return path.slice(0,Math.max(0,path.lastIndexOf("/")));}
 function folderUrl(path){return path?"#folder/"+path.split("/").map(encodeURIComponent).join("/"):"#";}
 for(const path of syncedFolders)addFolder(path);
 for(const file of files){
  file.relative=decodeURIComponent(file.path).split("/").slice(1).join("/");
  file.folder=parentOf(file.relative);
  addFolder(file.folder);
 }
 const sortNames=(a,b)=>a.localeCompare(b,"zh-CN",{numeric:true});
 const courseAliases={"python":"1023","writing":"1043","statistics":"1063"};
 const isAttachment=file=>!/\.md$/i.test(file.relative)||file.folder.split("/").includes("附件");
 function link(parent,href,label,className){
  const item=document.createElement("a");
  item.href=href;item.textContent=label;if(className)item.className=className;
  parent.append(item);return item;
 }
 function heading(parent,label){
  const item=document.createElement("h3");item.textContent=label;parent.append(item);
 }
 function breadcrumbs(path,note){
  const nav=get("crumbs");nav.replaceChildren();
  link(nav,"#","知识库首页");
  let current="";
  for(const part of path.split("/").filter(Boolean)){
   nav.append(" / ");
   current=current?current+"/"+part:part;
   link(nav,folderUrl(current),part);
  }
  if(note)nav.append(" / "+note.title);
 }
 function folderCards(path,query=""){
  const grid=get("folders");grid.replaceChildren();
  const children=[...folders].filter(child=>parentOf(child)===path).sort(sortNames);
  for(const child of children){
   const name=child.split("/").at(-1);
   const label=name.replace(/^(\d{4})(?=\s|$)/,"MCST$1");
   if(query&&!label.toLowerCase().includes(query)&&!name.toLowerCase().includes(query))continue;
   const count=files.filter(file=>file.relative.startsWith(child+"/")&&!isAttachment(file)).length;
   const card=link(grid,folderUrl(child),"","folder-card");
   const cover=document.createElement("div");cover.className="cover";cover.dataset.folder=child;cover.setAttribute("aria-hidden","true");
   if(folderCovers[child]){
    const image=document.createElement("img");image.alt="";image.loading="lazy";image.src="./assets/folder-covers/"+encodeURIComponent(folderCovers[child]);cover.append(image);
   }
   const body=document.createElement("div");body.className="card-body";
   const title=document.createElement("div");title.className="card-title";title.textContent=label;
   const meta=document.createElement("div");meta.className="count";meta.textContent=count+" 份笔记";
   body.append(title,meta);card.append(cover,body);
  }
  return grid.childElementCount;
 }
 let revision=0;
 async function render(){
  const current=++revision;
  const hash=location.hash;
  const note=files.find(file=>hash==="#note-"+file.id);
  let path=note?.folder??"";
  if(hash.startsWith("#folder/")){
   try{path=decodeURIComponent(hash.slice(8));}catch{path="";}
  }else if(hash.startsWith("#course-")){
   const legacy=hash.slice(8);
   if(legacy.startsWith("folder-")){
    try{path=decodeURIComponent(legacy.slice(7));}catch{path="";}
   }else if(courseAliases[legacy]){
    path=[...folders].find(folder=>folder.startsWith(courseAliases[legacy]+" "))??"";
   }
  }
  if(!folders.has(path))path="";
  const isHome=!note&&!path;
  document.body.classList.toggle("home",isHome);
  get("home-cover").hidden=!isHome;
  get("top-contact").hidden=!isHome;
  get("crumbs").hidden=isHome;
  if(!isHome)breadcrumbs(path,note);
  get("title").hidden=isHome||Boolean(note);
  get("title").textContent=path?path.split("/").at(-1):homeTitle;
  get("section-head").hidden=Boolean(note);
  get("section-title").hidden=isHome;
  get("search").hidden=!isHome;
  get("search").value="";
  get("folders").hidden=Boolean(note);
  const list=get("entries"),side=get("attachments"),reader=get("content"),download=get("download");
  list.replaceChildren();side.replaceChildren();reader.replaceChildren();
  download.hidden=!note;
  const direct=files.filter(file=>file.folder===path);
  const attachments=files.filter(file=>isAttachment(file)&&(file.folder===path||
   (path?file.folder.startsWith(path+"/"):false)&&file.folder.slice(path.length+1).split("/")[0]==="附件"));
  side.hidden=!attachments.length;
  get("workspace").classList.toggle("single",!attachments.length);
  if(attachments.length){
   heading(side,"附件下载");
   for(const file of attachments){
    const item=link(side,prefix+file.path,file.title);
    item.download=file.title;
   }
  }
  get("empty").hidden=true;
  if(!note){
   const count=folderCards(path);
   for(const file of direct.filter(file=>!isAttachment(file)).sort((a,b)=>sortNames(a.title,b.title))){
    link(list,"#note-"+file.id,file.title,"row");
   }
   if(path.startsWith("1023 ")&&parentOf(path)===""&&direct.some(file=>/^2 第二章/.test(file.title))){
    link(list,course,"Python 第二章 · 课程笔记","row");
   }
   if(!count&&!list.childElementCount&&!attachments.length){
    get("empty").textContent="这个文件夹是空的。";get("empty").hidden=false;
   }
   return;
  }
  download.href=prefix+note.path;
  download.textContent=isAttachment(note)?"下载文件":"下载 Markdown";
  if(!/\.md$/i.test(note.path)){
   if(imagePath.test(note.path)){
    const image=document.createElement("img");image.src=download.href;image.alt=note.title;reader.append(image);
   }
   return;
  }
  reader.textContent="正在加载笔记…";
  try{
   const response=await fetch(download.href,{cache:"no-cache"});
   if(!response.ok)throw Error();
   const markdown=await response.text();
   if(current===revision)reader.replaceChildren(renderMarkdown(markdown,note));
  }catch{
   if(current===revision)reader.textContent="无法预览笔记，可以下载原文。";
  }
 }
