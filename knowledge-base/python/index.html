<main class="wrap"><header class="hero"><p>Python 基础 · 第二章</p><h1>元组与列表</h1><p>含字典、集合、推导式与 Notebook 练习</p></header>

<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.3.3/dist/purify.min.js"></script>
<script>
window.addEventListener("DOMContentLoaded", async () => {
  const byId = id => document.getElementById(id);
  const root = "#/courses/python/";
  const route = () => {
    const [section, anchor] = location.hash.replace(/^#\/courses\/python\/?/, "").split("/");
    return {section: section === "transcript" ? "transcript" : "notes", anchor};
  };
  const sections = ["notes", "transcript"];
  const headings = {};
  function show() {
    const {section, anchor} = route();
    const isFirst = section === "notes";
    byId("pager-prev").hidden = isFirst;
    byId("pager-prev-off").hidden = !isFirst;
    byId("pager-next").hidden = !isFirst;
    byId("pager-next-off").hidden = isFirst;
    const outline = byId("outline");
    outline.replaceChildren();
    for (const name of sections) {
      byId(name).hidden = name !== section;
      if (name === section) byId(name + "-tab").setAttribute("aria-current", "page");
      else byId(name + "-tab").removeAttribute("aria-current");
    }
    for (const heading of headings[section]) {
      const link = document.createElement("a");
      link.href = root + section + "/" + heading.id;
      link.textContent = heading.textContent;
      if (anchor === heading.id) link.setAttribute("aria-current", "location");
      outline.append(link);
    }
    const target = anchor && byId(anchor);
    if (target && byId(section).contains(target)) target.scrollIntoView();
    else window.scrollTo(0, 0);
  }
  try {
    const response = await fetch("../%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A-%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E7%A1%95%E5%A3%AB/1023%20%E6%95%B0%E6%8D%AE%E7%A7%91%E5%AD%A6%E4%B8%8E%E7%BC%96%E7%A8%8B%EF%BC%88Python%EF%BC%89/2%20%E7%AC%AC%E4%BA%8C%E7%AB%A0%20%E9%9B%B6%E5%9F%BA%E7%A1%80%E8%AE%B2%E8%A7%A3.md");
    if (!response.ok) throw new Error("Markdown unavailable");
    const source = await response.text();
    const start = source.search(/^## 一、零基础讲解\s*$/m);
    const boundary = source.search(/^## 二、中英逐句对照稿\s*$/m);
    if (start < 0 || boundary <= start) throw new Error("Unexpected chapter structure");
    const segments = [source.slice(start, boundary), source.slice(boundary)];
    for (const [index, section] of sections.entries()) {
      const container = byId(section);
      container.innerHTML = DOMPurify.sanitize(marked.parse(segments[index]), {USE_PROFILES:{html:true}});
      headings[section] = Array.from(container.querySelectorAll("h3"));
      headings[section].forEach((heading, number) => { heading.id = section + "-" + (number + 1); });
    }
    byId("status").hidden = true;
    byId("back").hidden = false;
    byId("back").addEventListener("click", event => { event.preventDefault(); window.scrollTo(0, 0); });
    window.addEventListener("hashchange", show);
    show();
  } catch {
    const status = byId("status");
    status.classList.add("error");
    status.textContent = "暂时无法加载笔记。请刷新页面，或点击右上角下载 Markdown 原文。";
  }
});
</script></body></html>
